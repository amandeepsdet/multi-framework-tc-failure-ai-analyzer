[pytest]
# The suite is framework-agnostic and offline: it exercises the `aiqa` SDK and
# the `qa_ai_engine` package directly (no browser, no secrets).
addopts =
    -ra

testpaths = tests

markers =
    demo: End-to-end AIQA SDK demonstration (offline, no browser/secrets).
    ai: qa_ai_engine unit tests (offline, no browser/secrets).
    sdk: AIQA Quality Engineering SDK unit tests (offline, framework-agnostic).
