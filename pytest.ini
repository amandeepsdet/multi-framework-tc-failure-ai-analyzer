[pytest]
# Default run: headed browser, Allure + HTML reports, artifacts on failure.
addopts =
    --headed
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --output screenshots/artifacts
    --alluredir=reports/allure-results
    --clean-alluredir
    --html=reports/report.html
    --self-contained-html
    -ra

testpaths = tests

markers =
    ui: UI automation tests driven through Playwright.
    api: REST API automation tests.
    realtime: Live telemetry polling / refresh tests.
    negative: Negative / failure-path scenarios (invalid login, expired token, etc.).
    ai: AI Failure Analysis Engine unit tests (offline, no browser/secrets).
    sdk: AIQA Quality Engineering SDK unit tests (offline, framework-agnostic).
