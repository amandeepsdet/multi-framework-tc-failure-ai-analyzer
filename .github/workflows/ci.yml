name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Runtime deps for the shared demo conftest (Playwright/requests/etc.).
          # Only the Python packages are needed to import it; the offline SDK + AI
          # tests never launch a browser, so no `playwright install` is required.
          pip install -r requirements.txt
          pip install ruff black

      - name: Lint (ruff)
        run: ruff check aiqa
        continue-on-error: true

      - name: Format check (black)
        run: black --check aiqa
        continue-on-error: true

      - name: Run offline SDK + AI tests
        run: pytest tests/aiqa tests/ai tests/action -m "sdk or ai" -o addopts="" -q
